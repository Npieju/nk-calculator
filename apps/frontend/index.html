<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nk-calculator</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; line-height: 1.5; }
      .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
      label { width: 100%; max-width: 780px; }
      input { padding: 8px; width: 100%; min-width: 0; box-sizing: border-box; }
      button { padding: 8px 14px; cursor: pointer; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 12px 0; }
      .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      table { border-collapse: collapse; width: fit-content; min-width: 0; margin-top: 8px; table-layout: auto; }
      th, td { border: 1px solid #ddd; padding: 6px 8px; font-size: 13px; }
      th { background: #f5f5f5; }
      .muted { color: #666; }
      .ok { color: #0a7a1c; }
      .warn { color: #9a6b00; }
      .err { color: #b00020; }
      .hl-high { background: #fff4cc; font-weight: 700; }
      .hl-low { color: #9ca3af; }
      .scroll { overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; }
      .toolbar { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
      select { padding: 6px; }
      .all-split-wrap { display: flex; width: 100%; }
      .all-fixed { flex: 0 0 auto; background: #fff; border-right: 1px solid #ddd; }
      .all-fixed table, .all-scroll table { margin-top: 0; }
      .all-scroll { overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; width: 100%; }
      .excluded-picker { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; margin-top: 6px; max-width: 480px; }
      .excluded-item { display: flex; align-items: center; gap: 4px; font-size: 12px; }
      .excluded-item input { width: auto; padding: 0; }
      th.col-clip, td.col-clip {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      th.col-num, td.col-num {
        width: auto;
        max-width: 8ch;
      }
      th.col-horse-no, td.col-horse-no {
        width: auto;
        max-width: 6ch;
      }
      th.col-text, td.col-text {
        width: auto;
        max-width: 9em;
      }
      th.col-horse-display, td.col-horse-display {
        width: 11em;
        min-width: 11em;
        max-width: 11em;
        white-space: pre;
      }
      @media (max-width: 640px) {
        body { margin: 10px; }
        .card { padding: 10px; }
        .card-head h3 { font-size: 16px; margin: 0; }
        th, td { font-size: 12px; padding: 5px 6px; }
        .excluded-picker { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <h1>nk-calculator</h1>
    <p class="muted">netkeibaレースURLからオッズを比較します。</p>
    <p class="muted">対応URL: netkeiba の出馬表ページ（`/race/shutuba.html?race_id=...`）</p>
    <p class="muted">
      レース選択はこちらから:
      <a href="https://race.netkeiba.com/top/" target="_blank" rel="noopener noreferrer">https://race.netkeiba.com/top/</a>
    </p>
    <div class="row">
      <label>
        レースURL
        <br />
        <input id="raceUrl" value="https://race.netkeiba.com/race/shutuba.html?race_id=202608020611&rf=race_list" />
      </label>
    </div>
    <div class="row">
      <label>
        消し馬（オッズ計算から除外）
        <br />
        <div id="excludedPicker" class="excluded-picker"></div>
      </label>
      <label style="width: auto; max-width: none; align-self: end; font-size: 13px;">
        <input id="forceRefresh" type="checkbox" style="width: auto; margin-right: 6px;" />
        最新取得（キャッシュ無視）
      </label>
      <div style="align-self: end">
        <button id="runBtn">分析実行</button>
      </div>
    </div>

    <div id="meta" class="card"></div>
    <div id="status" class="card"></div>
    <div id="tables"></div>

    <script>
      const runBtn = document.getElementById("runBtn");
      const metaBox = document.getElementById("meta");
      const statusBox = document.getElementById("status");
      const tablesBox = document.getElementById("tables");
      const API_BASE_URL =
        window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
          ? "http://localhost:8000"
          : "https://nk-calculator-api.onrender.com";
      const tableOrder = ["all", "c1", "c2", "c3", "c4", "c5", "c6"];
      const tableStates = {};
      let statusCollapsed = true;
      let selectedHorseFilter = "__all__";
      let globalFilterNames = [];
      const COLUMN_LABELS_JA = {
        horse: "馬",
        horse_no: "馬番",
        horse_name: "馬名",
        horse_a: "馬A",
        horse_b: "馬B",
        horse_c: "馬C",
        win_odds: "単勝",
        place_odds: "複勝",
        quinella_flow_odds: "馬連",
        wide_flow_odds: "ワイド",
        exacta_first_flow_odds: "馬単1着",
        exacta_second_flow_odds: "馬単2着",
        trio_flow_odds: "三連複",
        trifecta_single_head_flow_odds: "三連単1頭軸マルチ",
        trifecta_first_flow_odds: "三単1着",
        trifecta_second_flow_odds: "三単2着",
        trifecta_third_flow_odds: "三単3着",
        trifecta_second_third_flow_odds: "三単2,3着",
        spread: "差異率",
        horse_no_a: "馬番A",
        horse_name_a: "馬名A",
        horse_no_b: "馬番B",
        horse_name_b: "馬名B",
        horse_no_c: "馬番C",
        horse_name_c: "馬名C",
        quinella_odds: "馬連",
        exacta_both_flow_odds: "馬単裏表",
        trifecta_top2_both_any_third_odds: "三単1-2着裏表3着全流し",
        exacta_odds: "馬単",
        trifecta_third_all_flow_odds: "三単3着全流し",
        wide_odds: "ワイド",
        trio_two_head_flow_odds: "三連複2頭軸",
        trifecta_two_head_multi_odds: "三単2頭軸マルチ",
        trio_odds: "三連複",
        trifecta_three_head_box_odds: "三単3頭BOX",
      };

      function escapeHtml(text) {
        return String(text ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function toNumber(value) {
        if (value === null || value === undefined) return null;
        if (typeof value === "number") return Number.isFinite(value) ? value : null;
        const text = String(value).trim().replaceAll(",", "");
        if (!text) return null;
        const n = Number(text);
        return Number.isFinite(n) ? n : null;
      }

      function formatCellValue(columnName, value) {
        const c = String(columnName);
        if (c.includes("horse_no") || c === "horse" || c === "horse_a" || c === "horse_b") {
          return value;
        }
        const n = toNumber(value);
        if (n === null) {
          return value;
        }
        if (String(columnName) === "spread") {
          return `${n.toFixed(1)}%`;
        }
        return n.toFixed(1);
      }

      function formatColumnLabel(columnName) {
        return COLUMN_LABELS_JA[columnName] || String(columnName);
      }

      function getColumnClass(columnName) {
        const c = String(columnName);
        if (c === "horse" || c === "horse_a" || c === "horse_b") {
          return "col-clip col-horse-display";
        }
        if (c.includes("horse_no")) {
          return "col-clip col-horse-no";
        }
        const isNumeric = c.includes("_odds") || c === "spread";
        return isNumeric ? "col-clip col-num" : "col-clip col-text";
      }

      function getSortedRows(rows, sortBy, sortOrder) {
        const copied = [...rows];
        if (!sortBy) return copied;

        copied.sort((a, b) => {
          const av = a?.[sortBy];
          const bv = b?.[sortBy];
          const an = toNumber(av);
          const bn = toNumber(bv);

          let result = 0;
          if (an !== null && bn !== null) {
            result = an - bn;
          } else if (an !== null) {
            result = -1;
          } else if (bn !== null) {
            result = 1;
          } else {
            result = String(av ?? "").localeCompare(String(bv ?? ""), "ja");
          }

          return sortOrder === "asc" ? result : -result;
        });
        return copied;
      }

      function getFilteredRows(rows, filterColumn, filterValue) {
        if (!filterColumn || !filterValue || filterValue === "__all__") {
          return [...rows];
        }
        return rows.filter((row) => String(row?.[filterColumn] ?? "") === filterValue);
      }

      function normalizeHorseName(value) {
        return String(value ?? "").replace(/\s+/g, " ").trim();
      }

      function getGlobalFilteredRows(tableKey, rows) {
        if (!selectedHorseFilter || selectedHorseFilter === "__all__") {
          return [...rows];
        }
        if (!["c3", "c4", "c5", "c6"].includes(tableKey)) {
          return [...rows];
        }
        const selected = normalizeHorseName(selectedHorseFilter);
        const tableNames = new Set(
          rows
            .flatMap((row) => [row?.horse_name_a, row?.horse_name_b, row?.horse_name_c])
            .map((v) => normalizeHorseName(v))
            .filter(Boolean)
        );
        if (!tableNames.has(selected)) {
          return [...rows];
        }
        if (tableKey === "c3" || tableKey === "c4" || tableKey === "c5") {
          return rows.filter((row) => normalizeHorseName(row?.horse_name_a) === selected || normalizeHorseName(row?.horse_name_b) === selected);
        }
        if (tableKey === "c6") {
          return rows.filter((row) => {
            const names = [row?.horse_name_a, row?.horse_name_b, row?.horse_name_c].map((v) => normalizeHorseName(v));
            return names.includes(selected);
          });
        }
        return [...rows];
      }

      function getSecondHorseFilteredRows(tableKey, rows, secondHorseFilter) {
        if (tableKey !== "c6") {
          return [...rows];
        }
        if (!secondHorseFilter || secondHorseFilter === "__all__") {
          return [...rows];
        }
        const selected = normalizeHorseName(secondHorseFilter);
        const tableNames = new Set(
          rows
            .flatMap((row) => [row?.horse_name_a, row?.horse_name_b, row?.horse_name_c])
            .map((v) => normalizeHorseName(v))
            .filter(Boolean)
        );
        if (!tableNames.has(selected)) {
          return [...rows];
        }
        return rows.filter((row) => {
          const names = [row?.horse_name_a, row?.horse_name_b, row?.horse_name_c].map((v) => normalizeHorseName(v));
          return names.includes(selected);
        });
      }

      function getFilteredRows2(rows, filterColumn, filterValue, filterColumn2, filterValue2) {
        let current = getFilteredRows(rows, filterColumn, filterValue);
        if (!filterColumn2 || !filterValue2 || filterValue2 === "__all__") {
          return current;
        }
        return current.filter((row) => String(row?.[filterColumn2] ?? "") === filterValue2);
      }

      function buildGlobalFilterCard() {
        return "";
      }

      function buildSyncedHorseFilterOptions() {
        if (!globalFilterNames.length) return "";
        return [`<option value="__all__" ${selectedHorseFilter === "__all__" ? "selected" : ""}>全表示</option>`]
          .concat(globalFilterNames.map((name) => `<option value="${escapeHtml(name)}" ${selectedHorseFilter === name ? "selected" : ""}>${escapeHtml(name)}</option>`))
          .join("");
      }

      function buildSecondHorseFilterOptions(secondHorseFilter) {
        if (!globalFilterNames.length) return "";
        const candidates = globalFilterNames.filter((name) => name !== selectedHorseFilter);
        return [`<option value="__all__" ${secondHorseFilter === "__all__" ? "selected" : ""}>全表示</option>`]
          .concat(candidates.map((name) => `<option value="${escapeHtml(name)}" ${secondHorseFilter === name ? "selected" : ""}>${escapeHtml(name)}</option>`))
          .join("");
      }

      function getDedupedDisplayRows(tableKey, rows) {
        const toText = (value) => String(value ?? "").trim();
        const seen = new Set();
        const out = [];

        for (const row of rows) {
          let key = "";
          if (tableKey === "c3" || tableKey === "c5") {
            const a = toText(row?.horse_no_a) || toText(row?.horse_name_a);
            const b = toText(row?.horse_no_b) || toText(row?.horse_name_b);
            key = [a, b].sort().join("|");
          } else if (tableKey === "c6") {
            const a = toText(row?.horse_no_a) || toText(row?.horse_name_a);
            const b = toText(row?.horse_no_b) || toText(row?.horse_name_b);
            const c = toText(row?.horse_no_c) || toText(row?.horse_name_c);
            key = [a, b, c].sort().join("|");
          } else {
            out.push(row);
            continue;
          }

          if (!key || seen.has(key)) {
            continue;
          }
          seen.add(key);
          out.push(row);
        }
        return out;
      }

      function getDisplayColumns(columns) {
        const out = [];
        for (const c of columns) {
          if (c === "horse_no" && columns.includes("horse_name")) {
            out.push("horse");
            continue;
          }
          if (c === "horse_name" && columns.includes("horse_no")) {
            continue;
          }
          if (c === "horse_no_a" && columns.includes("horse_name_a")) {
            out.push("horse_a");
            continue;
          }
          if (c === "horse_name_a" && columns.includes("horse_no_a")) {
            continue;
          }
          if (c === "horse_no_b" && columns.includes("horse_name_b")) {
            out.push("horse_b");
            continue;
          }
          if (c === "horse_name_b" && columns.includes("horse_no_b")) {
            continue;
          }
          if (c === "horse_no_c" && columns.includes("horse_name_c")) {
            out.push("horse_c");
            continue;
          }
          if (c === "horse_name_c" && columns.includes("horse_no_c")) {
            continue;
          }
          out.push(c);
        }
        return out;
      }

      function getDisplayValue(row, displayColumn) {
        const formatHorse = (horseNo, horseName) => {
          const noText = String(horseNo ?? "").trim();
          const nameText = String(horseName ?? "").trim();
          if (!noText && !nameText) return "";
          const paddedNo = /^\d$/.test(noText) ? ` ${noText}` : noText;
          return `${paddedNo}.${nameText}`.replace(/^\./, "").replace(/\.$/, "");
        };

        if (displayColumn === "horse") {
          return formatHorse(row?.horse_no, row?.horse_name);
        }
        if (displayColumn === "horse_a") {
          return formatHorse(row?.horse_no_a, row?.horse_name_a);
        }
        if (displayColumn === "horse_b") {
          return formatHorse(row?.horse_no_b, row?.horse_name_b);
        }
        if (displayColumn === "horse_c") {
          return formatHorse(row?.horse_no_c, row?.horse_name_c);
        }
        return row?.[displayColumn];
      }

      function getSortableColumns(columns) {
        return columns.filter((c) => {
          if (c === "horse_name" && columns.includes("horse_no")) return false;
          if (c === "horse_name_a" && columns.includes("horse_no_a")) return false;
          if (c === "horse_name_b" && columns.includes("horse_no_b")) return false;
          if (c === "horse_name_c" && columns.includes("horse_no_c")) return false;
          return true;
        });
      }

      function buildTableCard(state) {
        const title = state.title;
        const rows = state.rows;
        if (!Array.isArray(rows) || rows.length === 0) {
          return `<div class="card"><div class="card-head"><h3>${escapeHtml(title)}</h3><button onclick="window.toggleTableCollapse('${escapeHtml(state.key)}')">${state.collapsed ? "展開" : "折り畳み"}</button></div>${state.collapsed ? "" : '<p class="muted">データなし</p>'}</div>`;
        }

        const columns = Object.keys(rows[0]);
        const displayColumns = getDisplayColumns(columns);
        const sortableColumns = getSortableColumns(columns);
        const globalFiltered = getGlobalFilteredRows(state.key, rows);
        const secondFiltered = getSecondHorseFilteredRows(state.key, globalFiltered, state.secondHorseFilter);
        const filteredRows = getFilteredRows2(secondFiltered, state.filterColumn, state.filterValue, state.filterColumn2, state.filterValue2);
        const dedupedRows = getDedupedDisplayRows(state.key, filteredRows);
        const sortedRows = getSortedRows(dedupedRows, state.sortBy, state.sortOrder);
        const thead = `<tr>${displayColumns.map((c) => `<th class="${getColumnClass(c)}">${escapeHtml(formatColumnLabel(c))}</th>`).join("")}</tr>`;
        const options = sortableColumns
          .map((c) => `<option value="${escapeHtml(c)}" ${state.sortBy === c ? "selected" : ""}>${escapeHtml(formatColumnLabel(c))}</option>`)
          .join("");

        const filterCandidates = state.filterColumn && columns.includes(state.filterColumn)
          ? Array.from(new Set(rows.map((row) => String(row?.[state.filterColumn] ?? "")).filter(Boolean))).sort((a, b) => a.localeCompare(b, "ja"))
          : [];
        const filterOptions = [`<option value="__all__" ${state.filterValue === "__all__" ? "selected" : ""}>全表示</option>`]
          .concat(filterCandidates.map((v) => `<option value="${escapeHtml(v)}" ${state.filterValue === v ? "selected" : ""}>${escapeHtml(v)}</option>`))
          .join("");
        const filterCandidates2 = state.filterColumn2 && columns.includes(state.filterColumn2)
          ? Array.from(new Set(rows.map((row) => String(row?.[state.filterColumn2] ?? "")).filter(Boolean))).sort((a, b) => a.localeCompare(b, "ja"))
          : [];
        const filterOptions2 = [`<option value="__all__" ${state.filterValue2 === "__all__" ? "selected" : ""}>全表示</option>`]
          .concat(filterCandidates2.map((v) => `<option value="${escapeHtml(v)}" ${state.filterValue2 === v ? "selected" : ""}>${escapeHtml(v)}</option>`))
          .join("");
        const syncedFilterOptions = buildSyncedHorseFilterOptions();
        const secondHorseFilterOptions = buildSecondHorseFilterOptions(state.secondHorseFilter || "__all__");

        if (state.key === "all") {
          const fixedColumns = ["horse", "win_odds"].filter((c) => displayColumns.includes(c));
          const scrollColumns = displayColumns.filter((c) => !fixedColumns.includes(c));

          const fixedHead = `<tr>${fixedColumns.map((c) => `<th class="${getColumnClass(c)}">${escapeHtml(formatColumnLabel(c))}</th>`).join("")}</tr>`;
          const scrollHead = `<tr>${scrollColumns.map((c) => `<th class="${getColumnClass(c)}">${escapeHtml(formatColumnLabel(c))}</th>`).join("")}</tr>`;

          const fixedBody = sortedRows
            .map((row) => `<tr>${fixedColumns.map((c) => `<td class="${getColumnClass(c)}">${escapeHtml(formatCellValue(c, getDisplayValue(row, c)))}</td>`).join("")}</tr>`)
            .join("");
          const scrollBody = sortedRows
            .map((row) => `<tr>${scrollColumns.map((c) => `<td class="${getColumnClass(c)}">${escapeHtml(formatCellValue(c, getDisplayValue(row, c)))}</td>`).join("")}</tr>`)
            .join("");

          return `
            <div class="card">
              <div class="card-head">
                <h3>${escapeHtml(title)}</h3>
                <button onclick="window.toggleTableCollapse('${escapeHtml(state.key)}')">${state.collapsed ? "展開" : "折り畳み"}</button>
              </div>
              ${state.collapsed ? "" : `
              <div class="toolbar">
                <span>ソート列</span>
                <select onchange="window.changeSortColumn('${escapeHtml(state.key)}', this.value)">${options}</select>
                <button onclick="window.toggleSortOrder('${escapeHtml(state.key)}')">${state.sortOrder === "asc" ? "昇順" : "降順"}</button>
              </div>
              <div class="all-split-wrap">
                <div class="all-fixed">
                  <table>
                    <thead>${fixedHead}</thead>
                    <tbody>${fixedBody}</tbody>
                  </table>
                </div>
                <div class="all-scroll">
                  <table>
                    <thead>${scrollHead}</thead>
                    <tbody>${scrollBody}</tbody>
                  </table>
                </div>
              </div>
              `}
            </div>`;
        }

        const tbody = sortedRows
          .map((row) => {
            const numeric = state.highlightColumns
              .filter((col) => columns.includes(col))
              .map((col) => ({ col, value: toNumber(row[col]) }))
              .filter((item) => item.value !== null);

            const highCol = numeric.length ? numeric.reduce((a, b) => (a.value >= b.value ? a : b)).col : null;
            const lowCol = numeric.length ? numeric.reduce((a, b) => (a.value <= b.value ? a : b)).col : null;

            const tds = displayColumns
              .map((c) => {
                let cls = "";
                if (c === highCol) cls = "hl-high";
                else if (c === lowCol && lowCol !== highCol) cls = "hl-low";
                cls = `${cls} ${getColumnClass(c)}`.trim();
                return `<td class="${cls}">${escapeHtml(formatCellValue(c, getDisplayValue(row, c)))}</td>`;
              })
              .join("");

            return `<tr>${tds}</tr>`;
          })
          .join("");

        return `
          <div class="card">
            <div class="card-head">
              <h3>${escapeHtml(title)}</h3>
              <button onclick="window.toggleTableCollapse('${escapeHtml(state.key)}')">${state.collapsed ? "展開" : "折り畳み"}</button>
            </div>
            ${state.collapsed ? "" : `
            <div class="toolbar">
              <span>ソート列</span>
              <select onchange="window.changeSortColumn('${escapeHtml(state.key)}', this.value)">${options}</select>
              <button onclick="window.toggleSortOrder('${escapeHtml(state.key)}')">${state.sortOrder === "asc" ? "昇順" : "降順"}</button>
              ${["c3", "c4", "c5", "c6"].includes(state.key) ? `
              <span>絞り込み（共通）</span>
              <select onchange="window.changeGlobalHorseFilter(this.value)">${syncedFilterOptions}</select>
              ` : ""}
              ${state.key === "c6" ? `
              <span>絞り込み2（三連複系）</span>
              <select onchange="window.changeSecondHorseFilter('${escapeHtml(state.key)}', this.value)">${secondHorseFilterOptions}</select>
              ` : ""}
              ${state.filterColumn ? `
              <span>絞り込み</span>
              <select onchange="window.changeFilterValue('${escapeHtml(state.key)}', this.value)">${filterOptions}</select>
              ` : ""}
              ${state.filterColumn2 ? `
              <span>絞り込み2</span>
              <select onchange="window.changeFilterValue2('${escapeHtml(state.key)}', this.value)">${filterOptions2}</select>
              ` : ""}
            </div>
            <div class="scroll">
              <table>
                <thead>${thead}</thead>
                <tbody>${tbody}</tbody>
              </table>
            </div>
            `}
          </div>`;
      }

      function renderTables() {
        const htmlParts = [];
        for (const key of tableOrder) {
          const state = tableStates[key];
          if (!state) continue;
          htmlParts.push(buildTableCard(state));
        }
        tablesBox.innerHTML = htmlParts.join("");
      }

      function updateGlobalHorseFilterOptions(comparisons) {
        const allRows = [
          ...(comparisons.compare3 || []),
          ...(comparisons.compare4 || []),
          ...(comparisons.compare5 || []),
          ...(comparisons.compare6 || []),
        ];
        const names = Array.from(new Set(
          allRows.flatMap((row) => [row?.horse_name, row?.horse_name_a, row?.horse_name_b, row?.horse_name_c])
            .map((v) => normalizeHorseName(v))
            .filter(Boolean)
        )).sort((a, b) => a.localeCompare(b, "ja"));

        const findHorse1Name = () => {
          const sources = [
            ...(comparisons.compare1 || []),
            ...(comparisons.compare2 || []),
            ...(comparisons.compare3 || []),
            ...(comparisons.compare4 || []),
            ...(comparisons.compare5 || []),
            ...(comparisons.compare6 || []),
          ];
          for (const row of sources) {
            if (String(row?.horse_no ?? "") === "1") return normalizeHorseName(row?.horse_name);
            if (String(row?.horse_no_a ?? "") === "1") return normalizeHorseName(row?.horse_name_a);
            if (String(row?.horse_no_b ?? "") === "1") return normalizeHorseName(row?.horse_name_b);
            if (String(row?.horse_no_c ?? "") === "1") return normalizeHorseName(row?.horse_name_c);
          }
          return "";
        };
        const horse1Name = findHorse1Name();
        const hasSelected = selectedHorseFilter !== "__all__" && names.includes(selectedHorseFilter);
        if (!hasSelected) {
          selectedHorseFilter = horse1Name && names.includes(horse1Name) ? horse1Name : "__all__";
        }
        globalFilterNames = names;

        if (tableStates.c6) {
          const second = String(tableStates.c6.secondHorseFilter || "__all__");
          const validSeconds = names.filter((name) => name !== selectedHorseFilter);
          if (second !== "__all__" && !validSeconds.includes(second)) {
            tableStates.c6.secondHorseFilter = "__all__";
          }
        }
      }

      window.changeGlobalHorseFilter = (value) => {
        selectedHorseFilter = String(value || "__all__");
        renderTables();
      };

      window.changeSecondHorseFilter = (key, value) => {
        if (!tableStates[key]) return;
        tableStates[key].secondHorseFilter = String(value || "__all__");
        renderTables();
      };

      window.changeSortColumn = (key, column) => {
        if (!tableStates[key]) return;
        tableStates[key].sortBy = column;
        renderTables();
      };

      window.toggleSortOrder = (key) => {
        if (!tableStates[key]) return;
        tableStates[key].sortOrder = tableStates[key].sortOrder === "asc" ? "desc" : "asc";
        renderTables();
      };

      window.changeFilterValue = (key, value) => {
        if (!tableStates[key]) return;
        tableStates[key].filterValue = value;
        renderTables();
      };

      window.changeFilterValue2 = (key, value) => {
        if (!tableStates[key]) return;
        tableStates[key].filterValue2 = value;
        renderTables();
      };

      window.toggleTableCollapse = (key) => {
        if (!tableStates[key]) return;
        tableStates[key].collapsed = !tableStates[key].collapsed;
        renderTables();
      };

      window.toggleStatusCollapse = () => {
        statusCollapsed = !statusCollapsed;
        renderStatus(window.lastOddsStatus || {});
      };

      function renderOddsStatus(statusMap) {
        const rows = Object.entries(statusMap || {}).map(([k, v]) => {
          const st = v?.status || "unknown";
          const cls = st === "ok" ? "ok" : st === "error" ? "err" : "warn";
          return `<tr>
            <td>${escapeHtml(k)}</td>
            <td class="${cls}">${escapeHtml(st)}</td>
            <td>${escapeHtml(v?.rows)}</td>
            <td>${escapeHtml(v?.message)}</td>
          </tr>`;
        });
        return `
          <div class="card-head">
            <h3>取得ステータス</h3>
            <button onclick="window.toggleStatusCollapse()">${statusCollapsed ? "展開" : "折り畳み"}</button>
          </div>
          ${statusCollapsed ? "" : `
          <table>
            <thead><tr><th>券種</th><th>status</th><th>rows</th><th>message</th></tr></thead>
            <tbody>${rows.join("")}</tbody>
          </table>
          `}`;
      }

      function renderStatus(statusMap) {
        window.lastOddsStatus = statusMap || {};
        statusBox.innerHTML = renderOddsStatus(window.lastOddsStatus);
      }

      function initExcludedPicker() {
        const picker = document.getElementById("excludedPicker");
        if (!picker) return;
        picker.innerHTML = Array.from({ length: 18 }, (_, idx) => {
          const no = idx + 1;
          return `<label class="excluded-item"><input type="checkbox" value="${no}" />${no}</label>`;
        }).join("");
      }

      function getExcludedHorses() {
        return Array.from(document.querySelectorAll("#excludedPicker input[type='checkbox']:checked"))
          .map((el) => String(el.value));
      }

      function formatDateTimeText(value) {
        if (!value) return "-";
        const date = new Date(String(value));
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleString("ja-JP", { hour12: false });
      }

      async function runAnalyze() {
        const raceUrl = document.getElementById("raceUrl").value.trim();
        const excluded = getExcludedHorses();
        const forceRefresh = document.getElementById("forceRefresh")?.checked || false;

        metaBox.innerHTML = "実行中...";
        statusBox.innerHTML = "";
        tablesBox.innerHTML = "";

        try {
          const resp = await fetch(`${API_BASE_URL}/v1/analyze`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ race_url: raceUrl, excluded_horses: excluded, force_refresh: forceRefresh }),
          });
          const data = await resp.json();
          if (!resp.ok) {
            throw new Error(data?.detail || `HTTP ${resp.status}`);
          }

          const race = data.race || {};
          const oddsTimestamp = race.odds_updated_at || race.source_fetched_at || "-";
          const cacheText = race.cache_hit
            ? `キャッシュ利用（保存: ${formatDateTimeText(race.cache_stored_at)} / 経過: ${escapeHtml(race.cache_age_seconds)}秒）`
            : "最新取得（スクレイプ実行）";
          const refreshText = race.is_past_race
            ? "過去レースのため通常は最新取得不要"
            : "最新確認が必要な場合は「最新取得」を利用";
          metaBox.innerHTML = `
            <h3>レース情報</h3>
            <div>race_id: ${escapeHtml(race.race_id)}</div>
            <div>race_name: ${escapeHtml(race.race_name)}</div>
            <div>race_date: ${escapeHtml(race.race_date)}</div>
            <div>オッズ時点: ${escapeHtml(formatDateTimeText(oddsTimestamp))}</div>
            <div>データ取得元: ${escapeHtml(cacheText)}</div>
            <div>取得実行時刻: ${escapeHtml(formatDateTimeText(race.source_fetched_at || race.analyzed_at))}</div>
            <div>更新目安: ${escapeHtml(refreshText)}</div>
            <div>analyzed_at: ${escapeHtml(formatDateTimeText(race.analyzed_at || "-"))}</div>
          `;

          statusCollapsed = true;
          renderStatus(data.odds_status || {});

          const comparisons = data.comparisons || {};
          tableStates.all = {
            key: "all",
            title: "全券種比較（全流し合成オッズ）",
            rows: comparisons.all_market_compare || [],
            highlightColumns: [],
            sortBy: (comparisons.all_market_compare && comparisons.all_market_compare[0] && Object.keys(comparisons.all_market_compare[0])[0]) || "",
            sortOrder: "asc",
            collapsed: false,
            filterColumn: "",
            filterValue: "__all__",
          };
          tableStates.c1 = {
            key: "c1",
            title: "単勝系（等価）: 単勝 / 馬単1着全流し / 三連単1着全流し",
            rows: comparisons.compare1 || [],
            highlightColumns: ["win_odds", "exacta_first_flow_odds", "trifecta_first_flow_odds"],
            sortBy: "spread",
            sortOrder: "desc",
            collapsed: false,
            filterColumn: "",
            filterValue: "__all__",
          };
          tableStates.c2 = {
            key: "c2",
            title: "複勝系（等価）: 複勝 / 三連複1頭軸流し / 三連単1頭軸マルチ",
            rows: comparisons.compare2 || [],
            highlightColumns: ["place_odds", "trio_flow_odds", "trifecta_single_head_flow_odds"],
            sortBy: "spread",
            sortOrder: "desc",
            collapsed: false,
            filterColumn: "",
            filterValue: "__all__",
          };
          tableStates.c3 = {
            key: "c3",
            title: "馬連系（等価）: 馬連 / 馬単裏表 / 三単1-2着裏表3着全流し",
            rows: comparisons.compare3 || [],
            highlightColumns: ["quinella_odds", "exacta_both_flow_odds", "trifecta_top2_both_any_third_odds"],
            sortBy: "spread",
            sortOrder: "desc",
            collapsed: false,
            filterColumn: "",
            filterValue: "__all__",
            filterColumn2: "",
            filterValue2: "__all__",
            secondHorseFilter: "__all__",
          };
          tableStates.c4 = {
            key: "c4",
            title: "馬単系（等価）: 馬単 / 三単3着全流し",
            rows: comparisons.compare4 || [],
            highlightColumns: ["exacta_odds", "trifecta_third_all_flow_odds"],
            sortBy: "spread",
            sortOrder: "desc",
            collapsed: false,
            filterColumn: "",
            filterValue: "__all__",
            filterColumn2: "",
            filterValue2: "__all__",
            secondHorseFilter: "__all__",
          };
          tableStates.c5 = {
            key: "c5",
            title: "ワイド系（等価）: ワイド / 三連複2頭軸 / 三単2頭軸マルチ",
            rows: comparisons.compare5 || [],
            highlightColumns: ["wide_odds", "trio_two_head_flow_odds", "trifecta_two_head_multi_odds"],
            sortBy: "spread",
            sortOrder: "desc",
            collapsed: false,
            filterColumn: "",
            filterValue: "__all__",
            filterColumn2: "",
            filterValue2: "__all__",
            secondHorseFilter: "__all__",
          };
          tableStates.c6 = {
            key: "c6",
            title: "三連複系（等価）: 三連複 / 三単3頭BOX",
            rows: comparisons.compare6 || [],
            highlightColumns: ["trio_odds", "trifecta_three_head_box_odds"],
            sortBy: "spread",
            sortOrder: "desc",
            collapsed: false,
            filterColumn: "",
            filterValue: "__all__",
            filterColumn2: "",
            filterValue2: "__all__",
            secondHorseFilter: "__all__",
          };

          updateGlobalHorseFilterOptions(comparisons);

          renderTables();
        } catch (err) {
          metaBox.innerHTML = `<p class="err">${escapeHtml(err.message || err)}</p>`;
        }
      }

      initExcludedPicker();
      runBtn.addEventListener("click", runAnalyze);
    </script>
  </body>
</html>
