services:
  - type: web
    name: nk-calculator-api
    env: python
    rootDir: apps/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://Npieju.github.io
      - key: PYTHON_VERSION
        value: 3.10.18
