name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject API URL into frontend
        run: |
          cp apps/frontend/index.html apps/frontend/index.build.html
          sed -i "s|value=\"http://localhost:8000\"|value=\"${API_BASE_URL}\"|g" apps/frontend/index.build.html
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp apps/frontend/index.build.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
